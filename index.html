<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toprak Kafe Menü</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f0e8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .menu-wrapper {
      max-width: 1000px;
      width: 100%;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #5b3a29;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      min-height: 250px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
      transition: transform 0.3s;
      cursor: default;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3); /* karartma efekti */
    }

    .info {
      position: relative;
      color: #fff;
      padding: 15px;
      z-index: 2;
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
    }

    .name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #ffe8a3;
    }

    .note {
      margin-top: 30px;
      text-align: center;
      font-size: 16px;
      color: #5b3a29;
    }

    footer {
      text-align: center;
      color: #999;
      margin-top: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="menu-wrapper">
    <h1>🍵 Toprak Kafe Menü</h1>
    <div class="grid">
      <div class="card" style="background-image: url('images/kofte.png');">
        <div class="info">
          <div class="name">Köfte Ekmek</div>
          <div class="price">150₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/sucuk.png');">
        <div class="info">
          <div class="name">Sucuk Ekmek</div>
          <div class="price">120₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/tavuk.png');">
        <div class="info">
          <div class="name">Tavuk Tantuni</div>
          <div class="price">100₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/tost.png');">
        <div class="info">
          <div class="name">Tost</div>
          <div class="price">100₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/gunun_yemegi.png');">
        <div class="info">
          <div class="name">Günün Yemeği (Karışık Tabak)</div>
          <div class="price">170₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/ayran.png');">
        <div class="info">
          <div class="name">Ayran</div>
          <div class="price">30₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/cola.png');">
        <div class="info">
          <div class="name">Kutu Cola</div>
          <div class="price">40₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/fanta.png');">
        <div class="info">
          <div class="name">Kutu Fanta</div>
          <div class="price">40₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/sodalar.png');">
        <div class="info">
          <div class="name">Sodalar</div>
          <div class="price">20₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/avsar.png');">
        <div class="info">
          <div class="name">Avşarlar</div>
          <div class="price">20₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/cay.png');">
        <div class="info">
          <div class="name">Çay</div>
          <div class="price">15₺</div>
        </div>
      </div>

      <div class="card" style="background-image: url('images/oralet.png');">
        <div class="info">
          <div class="name">Oralet</div>
          <div class="price">15₺</div>
        </div>
      </div>
    </div>
    <div class="note">🧾 Sipariş için lütfen kasaya başvurun.</div>
    <footer>© 2025 Toprak Kafe</footer>
  </div>
</body>
</html>
